<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 720" role="img" aria-labelledby="title desc">
  <title id="title">Abstract neon XR geometry</title>
  <desc id="desc">Layered neon geometric entities forming a spatial structure.</desc>
  <defs>
    <linearGradient id="cyanPink" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#18e4ff"/>
      <stop offset="0.52" stop-color="#ff3df2"/>
      <stop offset="1" stop-color="#b8ff5e"/>
    </linearGradient>
    <radialGradient id="core" cx="50%" cy="45%" r="55%">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.9"/>
      <stop offset="0.18" stop-color="#18e4ff" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#070712" stop-opacity="0"/>
    </radialGradient>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="7" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <rect width="900" height="720" fill="none"/>
